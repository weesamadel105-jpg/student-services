<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>خدمات الطلاب</title>
<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}
header{
background:#2c7be5;
color:white;
padding:20px;
font-size:24px;
}
.container{
margin:40px;
}
input,select,textarea{
width:80%;
padding:10px;
margin:10px;
}
button{
background:#2c7be5;
color:white;
padding:12px 25px;
border:none;
font-size:18px;
cursor:pointer;
}
.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
width:80%;
margin:auto;
}
</style>
</head>

<body>

<header>
موقع خدمات الطلاب
</header>

<div class="container">

<div class="card">
<h2>إرسال واجب</h2>

<input type="text" placeholder="اسمك"><br>

<input type="text" placeholder="اسم الجامعة"><br>

<select>
<option>اختر السرعة</option>
<option>عادي</option>
<option>مستعجل</option>
</select><br>

<textarea placeholder="اكتب الواجب هنا" rows="6"></textarea><br>

<button onclick="send()">إرسال الواجب</button>

<p id="msg"></p>

</div>

</div>

<script>
function send(){
document.getElementById("msg").innerHTML="تم إرسال الواجب بنجاح وسيتم مراجعته من المعلمين";
}
</script>

</body>
</html>
