<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>خدمات الطلاب</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
direction:rtl;
}

header{
background:#2c7be5;
color:white;
padding:20px;
font-size:26px;
}

.container{
margin:40px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
width:90%;
max-width:500px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,textarea{
width:90%;
padding:10px;
margin:10px;
}

button{
background:#2c7be5;
color:white;
padding:12px;
border:none;
width:50%;
font-size:16px;
border-radius:6px;
}

#msg{
margin-top:20px;
color:green;
font-size:18px;
}

</style>
</head>

<body>

<header>
موقع خدمات الطلاب
</header>

<div class="container">

<div class="box">

<h2>إرسال الواجب</h2>

<input type="text" placeholder="اسمك"><br>

<input type="text" placeholder="اسم الجامعة"><br>

<select>
<option>اختر السرعة</option>
<option>عادي</option>
<option>مستعجل</option>
</select><br>

<textarea placeholder="اكتب تفاصيل الواجب"></textarea><br>

<input type="file"><br>

<button onclick="send()">إرسال الواجب</button>

<p id="msg"></p>

</div>

</div>

<script>

function send(){
document.getElementById("msg").innerHTML="تم إرسال الواجب ✔ سيتم مراجعته من المعلمين";
}

</script>

</body>
</html>
